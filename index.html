  energyCarrier: ["energy_carrier", "vector_energetico", "portador_energetico"],
  energySource: ["energy_source", "fuente_de_energia", "fuente_energetica", "origen_de_la_energia"],
  waterFlow: ["water_flow", "flujo_de_agua", "tipo_de_flujo", "flow_type", "flujo_hidrico"],
  waterSource: ["water_source", "fuente_de_agua", "origen_del_agua"],
  wasteType: ["waste_type", "tipo_de_residuo", "tipo_residuo", "clasificacion_de_residuo"],
  treatment: ["treatment", "tratamiento", "destino_del_residuo", "disposicion"],
  status: ["status", "estado"]
};
const FIELD_LABELS = {
  metricId: "Metric ID", measureId: "Measure ID", loc: "Business Location", name: "Nombre", countryCode: "Country Code",
  parent: "Nodo padre (ID_NODE)", legalEntity: "Legal Entity", companyCode: "Company Code", orgUnit: "Org Unit",
  periodType: "Period Type", year: "Period Year", month: "Period Month", quarter: "Period Quarter", value: "Value",
  unit: "Unit", source: "Source", validFrom: "Valid From", validTo: "Valid To", targetValue: "Target Value",
  targetYear: "Target Period", ghgScope: "GHG Scope", scope3Cat: "Scope Category", ghgType: "GHG Type",
  activityType: "Activity Type", valueChainStage: "Value Chain Stage", allocationMethod: "Allocation Method",
  energyCarrier: "Energy Carrier", energySource: "Energy Source", waterFlow: "Water Flow", waterSource: "Water Source",
  wasteType: "Waste Type", treatment: "Waste Treatment", status: "Status"
};
const norm = s => String(s == null ? "" : s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
function detectField(header) {
  const h = norm(header);
  for (const f in FIELD_SYNONYMS) if (FIELD_SYNONYMS[f].some(s => s === h)) return f;
  for (const f in FIELD_SYNONYMS) if (FIELD_SYNONYMS[f].some(s => h.includes(s) || s.includes(h))) return f;
  return null;
}
function detectType(mapping) {
  const f = Object.values(mapping).filter(Boolean);
  const has = k => f.includes(k);
  if (has("ghgScope") || (has("scope3Cat") && has("value"))) return "ghg";
  if (has("targetValue")) return "targets";
  if (has("name") && has("loc") && !has("value")) return "master";
  if (has("measureId") && has("value")) return "measures";
  if (has("metricId") && has("value")) return "actuals";
  if (has("value") && has("loc")) return "measures";
  return null;
}

/* ---------- CANONICALIZACIÓN DE VALORES ----------
   La detección de columnas (arriba) resuelve CABECERAS. Pero varias de las métricas
   Calculada dependen además de que el CONTENIDO de una celda coincida exactamente con
   un valor de dimensión (p.ej. dims.waterFlow === "Consumo"). Si el archivo trae
   "Consumption" o "consumo" en minúscula, el filtro no matchea y la métrica queda en
   cero de forma silenciosa — sin ningún error visible en el wizard. Estas tablas
   normalizan sinónimos habituales (ES/EN, con/sin acentos, mayúsculas) al valor
   canónico que usan los filtros de METRICS/STD_DIMENSIONS. */
const VALUE_CANON = {
  waterFlow: { consumo: "Consumo", consumption: "Consumo", neto: "Consumo", consumo_neto: "Consumo",
    extraccion: "Extracción", extraction: "Extracción", captacion: "Extracción", withdrawal: "Extracción", retiro: "Extracción" },
  wasteType: { peligroso: "Peligroso", peligrosos: "Peligroso", hazardous: "Peligroso",
    no_peligroso: "No peligroso", nonhazardous: "No peligroso", non_hazardous: "No peligroso", inerte: "No peligroso",
    reciclado: "Reciclado", recycled: "Reciclado", reciclaje: "Reciclado", reciclables: "Reciclado" },
  energySource: { ppa_renovable: "PPA renovable", ppa: "PPA renovable", renewable_ppa: "PPA renovable", renovable: "PPA renovable",
    solar_on_site: "Solar on-site", solar: "Solar on-site", onsite_solar: "Solar on-site", fotovoltaica: "Solar on-site",
    red_electrica: "Red eléctrica", grid: "Red eléctrica", red: "Red eléctrica",
    fosil: "Fósil", fossil: "Fósil" },
  allocationMethod: { market_based: "Market-based", market: "Market-based", mb: "Market-based", s2m: "Market-based", basado_en_mercado: "Market-based",
    location_based: "Location-based", location: "Location-based", lb: "Location-based", s2l: "Location-based", basado_en_ubicacion: "Location-based" }
};
function canonVal(field, raw) {
  const s = String(raw == null ? "" : raw).trim();
  if (!s) return s;
  const map = VALUE_CANON[field];
  if (map) { const k = norm(s); if (map[k]) return map[k]; }
  return s;
}
/* Medida (ID_MEASURE) para el import dedicado de recursos — acepta variantes ES/EN */
const MEASURE_CANON = {
  energy: "ENERGY", energia: "ENERGY", consumo_energetico: "ENERGY", consumo_de_energia: "ENERGY", electricidad: "ENERGY",
  water: "WATER", agua: "WATER", consumo_agua: "WATER", consumo_de_agua: "WATER",
  waste: "WASTE", residuos: "WASTE", residuo: "WASTE",
  co2e_avoided: "CO2E_AVOIDED", avoided: "CO2E_AVOIDED", avoided_emissions: "CO2E_AVOIDED", emisiones_evitadas: "CO2E_AVOIDED", co2e_evitado: "CO2E_AVOIDED",
  co2e: "CO2E", ghg: "CO2E", emisiones: "CO2E"
};
function canonMeasure(raw) {
  if (raw === null || raw === undefined || String(raw).trim() === "") return null;
  const k = norm(raw);
  if (MEASURE_CANON[k]) return MEASURE_CANON[k];
  const up = String(raw).trim().toUpperCase().replace(/\s+/g, "_");
  return up || null;
}
const RESOURCE_MEASURES = ["ENERGY", "WATER", "WASTE", "CO2E_AVOIDED"];
const RESOURCE_UNITS = { ENERGY: "kWh", WATER: "m3", WASTE: "kg", CO2E_AVOIDED: "tCO2e" };
/* Valor de un dato cualitativo — Boolean/Selección se validan contra opciones cerradas */
function canonQualValue(qm, raw) {
  const s = String(raw == null ? "" : raw).trim();
  if (!s) return null;
  if (qm.type === "Boolean") {
    const k = norm(s);
    if (["si", "s", "yes", "y", "true", "1"].includes(k)) return "Sí";
    if (["no", "n", "false", "0"].includes(k)) return "No";
    if (["no_aplica", "na", "n_a", "notapplicable"].includes(k)) return "No aplica";
    return null;
  }
  if (qm.type === "Selección") {
    const k = norm(s);
    const hit = (qm.options || []).find(o => norm(o) === k);
    return hit || null;
  }
  return s; // Texto corto / Texto largo: se acepta tal cual
}

function bindDropzone(w) {
  const drop = $("#w-drop", w), input = $("#w-file", w);
  drop.onclick = () => input.click();
  input.onchange = e => { if (e.target.files[0]) readFile(e.target.files[0]); };
  ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => { if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); });
  const sh = $("#w-sheet", w); if (sh) sh.onchange = e => { IMP.sheet = e.target.value; parseSheet(); drawWizard(); };
  $("#w-template", w).onclick = () => downloadTemplate();
}

let WB = null;
function readFile(file) {
  if (typeof XLSX === "undefined") { toast("SheetJS no está disponible (requiere conexión para el CDN).", "bad"); return; }
  IMP.file = file;
  const fr = new FileReader();
  fr.onload = e => {
    try {
      WB = XLSX.read(new Uint8Array(e.target.result), { type: "array", cellDates: true });
      IMP.sheets = WB.SheetNames;
      IMP.sheet = WB.SheetNames[0];
      parseSheet();
      drawWizard();
      toast("Archivo leído: " + fmt(IMP.rows.length) + " filas");
    } catch (err) { toast("No se pudo leer el archivo: " + err.message, "bad"); }
  };
  fr.readAsArrayBuffer(file);
}

/* Busca la fila de cabeceras aunque el archivo tenga títulos y notas arriba */
function parseSheet() {
  const ws = WB.Sheets[IMP.sheet];
  const matrix = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, blankrows: false, raw: true });
  let hi = 0, best = -1;
  matrix.slice(0, 12).forEach((row, i) => {
    const filled = row.filter(c => c !== null && String(c).trim() !== "").length;
    const known = row.filter(c => c && detectField(c)).length;
    const score = known * 3 + filled;
    if (filled >= 2 && score > best) { best = score; hi = i; }
  });
  const headers = (matrix[hi] || []).map((h, i) => (h === null || String(h).trim() === "") ? "COL_" + (i + 1) : String(h).trim());
  const rows = matrix.slice(hi + 1).filter(r => r.some(c => c !== null && String(c).trim() !== ""))
    .map(r => { const o = {}; headers.forEach((h, i) => o[h] = r[i] === undefined ? null : r[i]); return o; });
  IMP.headers = headers; IMP.rows = rows;
  IMP.mapping = {};
  headers.forEach(h => IMP.mapping[h] = detectField(h));
  if (!IMP.type || IMP.type === "auto") { IMP.type = detectType(IMP.mapping) || "measures"; }
}

function wizardNext() {
  if (IMP.step === 1) { IMP.step = 2; drawWizard(); return; }
  if (IMP.step === 2) { IMP.step = 3; drawWizard(); return; }
  if (IMP.step === 3) { IMP.results = validateImport(); IMP.step = 4; drawWizard(); return; }
}

/* ---------- VALIDACIÓN ---------- */
function validateImport() {
  const map = IMP.mapping, type = IMP.type;
  const inv = {}; Object.keys(map).forEach(h => { if (map[h]) inv[map[h]] = h; });
  const unmapped = IMP.headers.filter(h => !map[h]);
  const issues = [], out = [], seen = new Set();
  let errRows = 0, warnRows = 0;
  const metricIds = appState.metrics.map(m => m.id.toUpperCase());
  const locIds = appState.masterData.locations.map(l => l.id.toUpperCase());
  const REQ = { master: ["loc", "name"], actuals: ["metricId", "value"], targets: ["metricId", "targetValue"], measures: ["value"], ghg: ["value"], resources: ["value", "measureId"], qualitative: ["metricId", "value"] }[type] || ["value"];

  IMP.rows.forEach((r, i) => {
    const rowNo = i + 2, msgs = [];
    let kind = "valid";
    const g = f => { const h = inv[f]; return h === undefined ? null : r[h]; };
    // campos obligatorios
    REQ.forEach(f => { const v = g(f); if (v === null || v === undefined || String(v).trim() === "") { msgs.push("Falta el campo obligatorio " + FIELD_LABELS[f]); kind = "error"; } });
    // número válido
    const vRaw = type === "targets" ? g("targetValue") : g("value");
    let num = null;
    if (type !== "master" && type !== "qualitative") {
      // Los valores numéricos de una celda Excel llegan como number JS nativo (punto decimal).
      // Sólo si el valor llegó como texto (CSV, celda con formato de texto) intentamos interpretar
      // separadores de miles/decimales en formato ES-AR (1.234,56); un número ya parseado nunca se reescribe.
      if (typeof vRaw === "number") {
        num = vRaw;
      } else if (vRaw !== null && vRaw !== undefined && String(vRaw).trim() !== "") {
        let sv = String(vRaw).trim();
        if (/,/.test(sv) && /\.\d{3}(?!\d)/.test(sv)) sv = sv.replace(/\./g, "").replace(",", ".");
        else if (/,/.test(sv) && !/\./.test(sv)) sv = sv.replace(",", ".");
        num = parseFloat(sv);
      }
      if (vRaw !== null && vRaw !== undefined && vRaw !== "" && isNaN(num)) { msgs.push("Valor numérico inválido: “" + vRaw + "”"); kind = "error"; }
      if (num !== null && num < 0) { msgs.push("Valor negativo"); if (kind !== "error") kind = "warning"; }
    }
    // período
    let year = parseInt(g("year") || g("targetYear") || filters.year, 10);
    if (isNaN(year) || year < 2000 || year > 2050) { msgs.push("Período inválido: " + g("year")); kind = "error"; year = null; }
    const rawMonth = g("month");
    let month = (rawMonth === null || rawMonth === undefined || String(rawMonth).trim() === "") ? null : parseInt(rawMonth, 10);
    if (month !== null && (isNaN(month) || month < 1 || month > 12)) { msgs.push("Mes inválido: " + g("month")); if (kind !== "error") kind = "warning"; month = null; }
    // ubicación
    let loc = g("loc") ? String(g("loc")).trim() : null;
    if (loc) {
      const found = appState.masterData.locations.find(l => l.id.toUpperCase() === loc.toUpperCase() || l.name.toLowerCase() === loc.toLowerCase());
      if (found) loc = found.id;
      else if (type === "master") { /* se creará */ }
      else { msgs.push("Ubicación inexistente: " + loc); kind = "error"; }
    } else if (type !== "master") { loc = "GRP"; msgs.push("Sin ubicación: se asigna al nodo Grupo"); if (kind !== "error") kind = "warning"; }
    // unidad
    if (type !== "master" && type !== "qualitative" && !g("unit")) { msgs.push("Unidad vacía"); if (kind !== "error") kind = "warning"; }
    // medida conocida (import dedicado de recursos)
    if (type === "resources") {
      const rawM = g("measureId");
      const canonM = canonMeasure(rawM);
      if (!canonM || !RESOURCE_MEASURES.includes(canonM)) {
        msgs.push("Medida desconocida: “" + rawM + "” (valores permitidos: " + RESOURCE_MEASURES.join(", ") + ")");
        kind = "error";
      }
    }
    // métrica conocida
    let metricId = g("metricId") ? String(g("metricId")).trim() : null;
    if ((type === "actuals" || type === "targets") && metricId) {
      const byId = metricIds.includes(metricId.toUpperCase());
      const byName = appState.metrics.find(m => m.name.toLowerCase() === metricId.toLowerCase());
      if (byName) metricId = byName.id;
      else if (!byId) { msgs.push("Métrica desconocida: " + metricId); kind = "error"; }
      else metricId = appState.metrics.find(m => m.id.toUpperCase() === metricId.toUpperCase()).id;
    } else if (type === "qualitative" && metricId) {
      const qlIds = appState.qualitativeMetrics.map(m => m.id.toUpperCase());
      const byName = appState.qualitativeMetrics.find(m => m.name.toLowerCase() === metricId.toLowerCase());
      if (byName) metricId = byName.id;
      else if (!qlIds.includes(metricId.toUpperCase())) { msgs.push("Indicador cualitativo desconocido: " + metricId); kind = "error"; }
      else metricId = appState.qualitativeMetrics.find(m => m.id.toUpperCase() === metricId.toUpperCase()).id;
      if (kind !== "error") {
        const qm = appState.qualitativeMetrics.find(m => m.id === metricId);
        const rawVal = g("value");
        if (qm && rawVal !== null && String(rawVal).trim() !== "" && canonQualValue(qm, rawVal) === null) {
          msgs.push("Valor no reconocido para tipo " + qm.type + ": “" + rawVal + "”" + (qm.options ? " (opciones válidas: " + qm.options.join(", ") + ")" : qm.type === "Boolean" ? " (valores válidos: Sí, No, No aplica)" : ""));
          if (kind !== "error") kind = "warning";
        }
      }
    }
    // duplicados: fila íntegramente repetida (todas las columnas iguales), no sólo la misma métrica/período.
    // Dos filas del mismo mes que difieren en cualquier columna (método de asignación, tipo de residuo,
    // flujo de agua, actividad, dimensión personalizada, etc.) son registros legítimamente distintos.
    const key = IMP.headers.map(h => String(r[h] === undefined || r[h] === null ? "" : r[h])).join("|");
    if (seen.has(key)) { msgs.push("Registro duplicado en el archivo (fila idéntica a otra)"); if (kind !== "error") kind = "warning"; }
    seen.add(key);

    msgs.forEach(m => issues.push({ row: rowNo, kind: kind === "error" ? "error" : "warning", msg: m }));
    if (kind === "error") errRows++; else if (kind === "warning") warnRows++;
    if (kind !== "error") out.push({ raw: r, g, num, year, month, loc, metricId, kind });
  });

  // dimensiones personalizadas a partir de columnas no mapeadas
  const newDims = [];
  unmapped.forEach(h => {
    const vals = Array.from(new Set(IMP.rows.map(r => r[h]).filter(v => v !== null && String(v).trim() !== "").map(String)));
    if (!vals.length || vals.length > 40) return;
    const id = norm(h).toUpperCase();
    if (getAvailableDimensions().find(d => d.id === id)) return;
    newDims.push({ id, name: h, header: h, values: vals, area: "Environmental", std: false, desc: "Dimensión detectada en la importación de " + IMP.file.name });
  });

  return {
    total: IMP.rows.length, valid: out.length,
    warnings: warnRows, errors: errRows,
    issues, rows: out, newDims, unmapped
  };
}

/* ---------- IMPORTACIÓN AL ESTADO ---------- */
function commitImport() {
  const r = IMP.results, type = IMP.type;
  const btn = $("#w-import"); if (btn) { btn.disabled = true; btn.innerHTML = '<i data-lucide="loader-2"></i> Importando…'; icons(); }
  setTimeout(() => {
    // 1. registrar dimensiones personalizadas nuevas
    r.newDims.forEach(d => {
      appState.customDimensions.push({ id: d.id, name: d.name, area: d.area, values: d.values, std: false, desc: d.desc, created: new Date().toISOString().slice(0, 10) });
      audit("Custom dimension created", "Dimension: " + d.name + " (" + d.values.length + " valores)", "layers");
    });
    let n = 0;
    r.rows.forEach(row => {
      const g = row.g;
      if (type === "master") {
        const id = String(g("loc")).trim().toUpperCase();
        const ex = appState.masterData.locations.find(l => l.id === id);
        const parent = g("parent") ? String(g("parent")).trim().toUpperCase() : "GRP";
        const rec = {
          id, name: String(g("name") || id), parent: appState.masterData.locations.find(l => l.id === parent) ? parent : null,
          type: "Planta", country: g("countryCode") || "", countryName: ({ AR: "Argentina", UY: "Uruguay", BR: "Brasil" })[g("countryCode")] || String(g("countryCode") || "—"),
          entity: g("legalEntity") || "LE-100", validFrom: String(g("validFrom") || "2026-01-01").slice(0, 10), operable: true, employees: null
        };
        if (ex) Object.assign(ex, rec); else appState.masterData.locations.push(rec);
        n++;
      } else if (type === "targets") {
        const m = appState.metrics.find(x => x.id === row.metricId);
        const tgtLoc = row.loc || "ALL";
        // Reemplaza cualquier objetivo previo del mismo indicador+ubicación en vez de apilarlo
        appState.targets = appState.targets.filter(x => !(x.metricId === row.metricId && (x.loc || "GRP") === tgtLoc));
        appState.targets.unshift({
          id: nid("TGT"), name: "Objetivo importado · " + (m ? m.name : row.metricId), metricId: row.metricId, area: m ? m.area : "Environmental",
          desc: "Objetivo cargado desde " + IMP.file.name, baseYear: CONFIG.BASE_YEAR,
          baseValue: computeMetric(appState, row.metricId, { year: CONFIG.BASE_YEAR, period: "FY", loc: tgtLoc }) ?? row.num,
          targetYear: row.year || 2030, targetValue: row.num, unit: g("unit") || (m ? m.unit : ""), loc: tgtLoc, createdBy: CONFIG.USER.name
        });
        n++;
      } else if (type === "actuals") {
        appState.actuals.push({
          id: nid("ACT"), metricId: row.metricId, loc: row.loc, country: (appState.masterData.locations.find(l => l.id === row.loc) || {}).countryName || "—",
          entity: g("legalEntity") || (appState.masterData.locations.find(l => l.id === row.loc) || {}).entity || "LE-100",
          periodType: row.month ? "M" : "Y", y: row.year, m: row.month, q: row.month ? Math.ceil(row.month / 3) : (g("quarter") ? parseInt(g("quarter"), 10) : null),
          value: row.num, unit: String(g("unit") || ""), src: String(g("source") || IMP.file.name), status: row.kind === "warning" ? "Con advertencias" : "Validado"
        });
        n++;
      } else if (type === "qualitative") {
        const qm = appState.qualitativeMetrics.find(x => x.id === row.metricId);
        if (qm) {
          const canon = canonQualValue(qm, g("value"));
          const v = canon !== null ? canon : String(g("value") || "").trim();
          const ex = appState.qualitative.find(x => x.metricId === row.metricId);
          const rec = {
            metricId: row.metricId, loc: row.loc || "GRP", y: row.year || CONFIG.CURRENT_YEAR, value: v,
            status: canon !== null ? "Validado" : "Con advertencias", src: String(g("source") || IMP.file.name),
            updated: new Date().toISOString().slice(0, 10)
          };
          if (ex) Object.assign(ex, rec); else appState.qualitative.push(Object.assign({ id: nid("QLD") }, rec));
          n++;
        }
      } else { // measures / ghg / resources
        const dims = {};
        ["ghgScope", "scope3Cat", "ghgType", "activityType", "valueChainStage", "allocationMethod",
          "energyCarrier", "energySource", "waterFlow", "waterSource", "wasteType", "treatment"].forEach(f => {
          const v = g(f); if (v !== null && v !== undefined && String(v).trim() !== "") dims[f] = canonVal(f, v);
        });
        if (type === "ghg" && !dims.ghgScope) dims.ghgScope = "Scope 3";
        if (dims.ghgScope === "Scope 2" && !dims.allocationMethod) dims.allocationMethod = filters.s2;
        r.newDims.forEach(d => { const v = row.raw[d.header]; if (v !== null && String(v).trim() !== "") dims[dimKey(d.id)] = String(v).trim(); });
        r.unmapped.forEach(h => {
          const dd = getAvailableDimensions().find(x => norm(x.name) === norm(h) || x.id === norm(h).toUpperCase());
          if (dd && row.raw[h] !== null && String(row.raw[h]).trim() !== "") dims[dimKey(dd.id)] = String(row.raw[h]).trim();
        });
        const loc = appState.masterData.locations.find(l => l.id === row.loc) || { countryName: "—", entity: "LE-100" };
        const measure = type === "ghg" ? "CO2E" : type === "resources" ? canonMeasure(g("measureId")) : (String(g("measureId") || "CUSTOM").toUpperCase());
        appState.measures.push({
          id: nid("MSR"), measure,
          value: row.num, unit: String(g("unit") || (type === "ghg" ? "tCO2e" : type === "resources" ? (RESOURCE_UNITS[measure] || "") : "")),
          loc: row.loc, country: loc.countryName, entity: g("legalEntity") || loc.entity,
          y: row.year, m: row.month || 12, q: row.month ? Math.ceil(row.month / 3) : 4,
          src: String(g("source") || IMP.file.name), dims
        });
        n++;
      }
    });

    appState.imports.unshift({
      id: nid("IMP"), ts: new Date().toISOString().slice(0, 16).replace("T", " "), file: IMP.file.name,
      type: (IMPORT_TYPES.find(t => t.id === type) || {}).name || type, rows: r.total, valid: r.valid,
      warnings: r.warnings, errors: r.errors, user: CONFIG.USER.name, status: r.errors ? "Completada con errores" : "Completada"
    });
    audit("Import completed", "File: " + IMP.file.name + " · Rows: " + fmt(r.total) + " · " + fmt(n) + " importadas" + (r.warnings ? " · " + r.warnings + " warnings" : ""), "upload");

    closeModal();
    toast(fmt(n) + " registros importados correctamente.");
    if (r.newDims.length) setTimeout(() => toast("Nueva dimensión disponible como filtro: " + r.newDims.map(d => d.name).join(", ")), 700);
    destroyCharts(); renderFilters(); render();
  }, 450);
}

/* Plantilla de ejemplo generada en el navegador — permite probar el flujo completo */
function downloadTemplate() {
  if (typeof XLSX === "undefined") { toast("SheetJS no disponible.", "bad"); return; }
  const type = IMP.type === "auto" ? "ghg" : IMP.type;
  let rows;
  if (type === "master") {
    rows = [["ID_BUSINESS_LOC", "NAME_BUSINESS_LOC", "COUNTRY_CODE", "ID_NODE", "ID_LEGAL_ENTITY", "VALID_FROM"],
    ["AR-MDP", "Planta Mar del Plata", "AR", "AR", "LE-110", "2026-01-01"],
    ["UY-PAY", "Planta Paysandú", "UY", "UY", "LE-210", "2026-01-01"]];
  } else if (type === "actuals") {
    rows = [["ID_METRIC", "ID_BUSINESS_LOC", "PERIOD_TYPE", "PERIOD_YEAR", "PERIOD_MONTH", "VALUE", "UNIT", "ID_SOURCE"]];
    ["AR-BUE", "UY-MVD", "BR-SAO"].forEach(l => [1, 2, 3].forEach(m => rows.push(["SOC-TRAIN", l, "M", 2026, m, +(18 + RND() * 10).toFixed(1), "h/FTE", "HR System"])));
  } else if (type === "targets") {
    rows = [["ID_METRIC", "ID_BUSINESS_LOC", "TARGET_PERIOD", "TARGET_VALUE", "UNIT"],
    ["ENV-WASTE", "GRP", 2030, 68000, "t"], ["SOC-TURN", "GRP", 2029, 8, "%"]];
  } else if (type === "ghg") {
    /* 16 columnas: se agrega ALLOCATION_METHOD respecto de la plantilla anterior de 15.
       Sin esta columna, todo registro de Scope 2 se importaba como Market-based por defecto
       (ver commitImport) y era imposible cargar Location-based. */
    rows = [["ID_SOURCE", "ID_BUSINESS_LOC", "PERIOD_TYPE", "PERIOD_YEAR", "PERIOD_MONTH", "ID_MEASURE", "MEASURE_VALUE", "MEASURE_UNIT", "GHG_SCOPE", "ALLOCATION_METHOD", "SCOPE_CATEGORY", "GHG_TYPE", "ACTIVITY_TYPE", "VALUE_CHAIN_STAGE", "TRANSPORT_TYPE", "SHIPMENT_MODE"]];
    const locs4 = ["AR-BUE", "AR-COR", "UY-MVD", "BR-SAO"];
    // Scope 1 — combustión directa. ALLOCATION_METHOD no aplica: se deja en blanco.
    locs4.forEach((l, i) => rows.push([CONFIG.CARBON_APP, l, "M", 2026, 3 + (i % 3), "CO2E", +(180 + RND() * 420).toFixed(2), "tCO2e", "Scope 1", "", "", "CO2", i % 2 ? "Combustión móvil" : "Combustión estacionaria", "—", "", ""]));
    // Scope 2 — electricidad adquirida. Se cargan AMBOS métodos como registros paralelos
    // (no se suman entre sí: filterDataset() ya aplica la regla anti doble conteo por método).
    locs4.forEach((l, i) => {
      rows.push([CONFIG.CARBON_APP, l, "M", 2026, 3 + (i % 3), "CO2E", +(900 + RND() * 1600).toFixed(2), "tCO2e", "Scope 2", "Market-based", "", "CO2", "Electricidad adquirida", "—", "", ""]);
      rows.push([CONFIG.CARBON_APP, l, "M", 2026, 3 + (i % 3), "CO2E", +(700 + RND() * 1900).toFixed(2), "tCO2e", "Scope 2", "Location-based", "", "CO2", "Electricidad adquirida", "—", "", ""]);
    });
    // Scope 3 — transporte y distribución (sin método de asignación)
    const cats = [["Scope 3", "Cat. 4 · Transporte y distribución upstream", "Upstream"], ["Scope 3", "Cat. 9 · Transporte y distribución downstream", "Downstream"]];
    locs4.forEach(l => cats.forEach(c => ["Truck", "Ship", "Rail", "Air"].forEach((t, i) => {
      rows.push([CONFIG.CARBON_APP, l, "M", 2026, 7 + (i % 3), "CO2E", +(1200 + RND() * 5400).toFixed(2), "tCO2e", c[0], "", c[1], "CO2", "Transporte y distribución", c[2], t, i % 2 ? "FTL" : "LTL"]);
    })));
  } else if (type === "resources") {
    /* Alimenta las 7 métricas Calculada sin vía de importación: ENV-ENERGY, ENV-ENERGY-REN,
       ENV-WATER-CONS, ENV-WATER-WD, ENV-WASTE, ENV-WASTE-HAZ, ENV-GHG-AVOID.
       ID_MEASURE decide la unidad esperada: ENERGY→kWh, WATER→m3, WASTE→kg, CO2E_AVOIDED→tCO2e.
       ENERGY_SOURCE / WATER_FLOW / WASTE_TYPE sólo se completan para la medida que corresponde. */
    rows = [["ID_SOURCE", "ID_BUSINESS_LOC", "PERIOD_TYPE", "PERIOD_YEAR", "PERIOD_MONTH", "ID_MEASURE", "MEASURE_VALUE", "MEASURE_UNIT", "ENERGY_SOURCE", "WATER_FLOW", "WASTE_TYPE"]];
    ["AR-BUE", "UY-MVD"].forEach((l, i) => {
      const m = 4 + i;
      rows.push([CONFIG.CARBON_APP, l, "M", 2026, m, "ENERGY", +(180000 + RND() * 60000).toFixed(0), "kWh", "Red eléctrica", "", ""]);
      rows.push([CONFIG.CARBON_APP, l, "M", 2026, m, "ENERGY", +(70000 + RND() * 30000).toFixed(0), "kWh", "PPA renovable", "", ""]);
      rows.push([CONFIG.CARBON_APP, l, "M", 2026, m, "ENERGY", +(20000 + RND() * 12000).toFixed(0), "kWh", "Solar on-site", "", ""]);
      rows.push([CONFIG.CARBON_APP, l, "M", 2026, m, "WATER", +(8000 + RND() * 3000).toFixed(0), "m3", "", "Extracción", ""]);
      rows.push([CONFIG.CARBON_APP, l, "M", 2026, m, "WATER", +(5000 + RND() * 2000).toFixed(0), "m3", "", "Consumo", ""]);
      rows.push([CONFIG.CARBON_APP, l, "M", 2026, m, "WASTE", +(3200 + RND() * 900).toFixed(0), "kg", "", "", "No peligroso"]);
      rows.push([CONFIG.CARBON_APP, l, "M", 2026, m, "WASTE", +(600 + RND() * 300).toFixed(0), "kg", "", "", "Reciclado"]);
      rows.push([CONFIG.CARBON_APP, l, "M", 2026, m, "WASTE", +(140 + RND() * 90).toFixed(0), "kg", "", "", "Peligroso"]);
      rows.push([CONFIG.CARBON_APP, l, "M", 2026, m, "CO2E_AVOIDED", +(40 + RND() * 60).toFixed(2), "tCO2e", "", "", ""]);
    });
  } else if (type === "qualitative") {
    rows = [["ID_QL", "VALUE", "ID_BUSINESS_LOC", "PERIOD_YEAR", "ID_SOURCE"]];
    QUALITATIVE_METRICS.forEach(m => {
      const ex = m.type === "Boolean" ? "Sí" : m.type === "Selección" ? ((m.options || [])[0] || "") : "Reemplazar por la respuesta real.";
      rows.push([m.id, ex, "GRP", 2026, "Carga manual"]);
    });
  } else {
    // measures (genérico / DPI) — plantilla sin cambios, ya funciona
    rows = [["ID_SOURCE", "ID_BUSINESS_LOC", "PERIOD_TYPE", "PERIOD_YEAR", "PERIOD_MONTH", "ID_MEASURE", "MEASURE_VALUE", "MEASURE_UNIT", "GHG_SCOPE", "SCOPE_CATEGORY", "GHG_TYPE", "ACTIVITY_TYPE", "VALUE_CHAIN_STAGE", "TRANSPORT_TYPE", "SHIPMENT_MODE"]];
    const cats = [["Scope 3", "Cat. 4 · Transporte y distribución upstream", "Upstream"], ["Scope 3", "Cat. 9 · Transporte y distribución downstream", "Downstream"]];
    ["AR-BUE", "AR-COR", "UY-MVD", "BR-SAO"].forEach(l => cats.forEach(c => ["Truck", "Ship", "Rail", "Air"].forEach((t, i) => {
      rows.push([CONFIG.CARBON_APP, l, "M", 2026, 7 + (i % 3), "CO2E", +(1200 + RND() * 5400).toFixed(2), "tCO2e", c[0], c[1], "CO2", "Transporte y distribución", c[2], t, i % 2 ? "FTL" : "LTL"]);
    })));
  }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), "Data");
  XLSX.writeFile(wb, "IVZ_plantilla_" + type + ".xlsx");
  toast("Plantilla descargada. Cargala para probar el flujo completo.");
}

    '<tr class="clickable" id="r-open"><td><b>' + esc(appState.report.meta.title) + '</b></td><td class="mono">' + appState.report.meta.year + "</td><td>" + esc(appState.report.meta.scopeName) + "</td>" +
    '<td><span class="badge warn">Draft</span></td><td class="r"><i data-lucide="chevron-right" style="width:15px;height:15px"></i></td></tr></tbody></table></div>'
    : '<div class="empty"><div class="e-ico"><i data-lucide="file-text"></i></div><h4>Todavía no generaste reportes</h4><p>El borrador se construye con los valores actualmente cargados en la sesión.</p><button class="btn pri" onclick="openReportWizard()"><i data-lucide="wand-2"></i> Generar reporte</button></div>';
  if ($("#r-open")) $("#r-open").onclick = () => { ui.tab.reportes = "editor"; render(); };
}

/* ---------- WIZARD DEL GENERADOR ---------- */
let RW = null;
function openReportWizard() {
  RW = { step: 1, year: filters.year, scope: "ALL", scopeKind: "L", s2: filters.s2, template: "gen", sections: REPORT_SECTIONS.map(s => ({ ...s })) };
  drawReportWizard();
}
function drawReportWizard() {
  const steps = ["Período", "Alcance", "Plantilla", "Secciones"].map((s, i) =>
    '<div class="step ' + (RW.step === i + 1 ? "on" : RW.step > i + 1 ? "done" : "") + '"><span class="n">' + (RW.step > i + 1 ? "✓" : i + 1) + "</span>" + s + "</div>").join("");
  let body = "";
  if (RW.step === 1) {
    body = '<p class="muted" style="margin-top:0">Seleccioná el ejercicio a reportar. Todos los valores del borrador se calculan sobre ese período.</p>' +
      '<div class="grid g4">' + Array.from(new Set([...CONFIG.YEARS, ...appState.measures.map(r => r.y), ...appState.actuals.map(r => r.y)])).sort((a,b) => b-a).map(y =>
        '<div class="card" data-ry="' + y + '" style="cursor:pointer;' + (RW.year === y ? "border-color:var(--accent);background:var(--accent-soft)" : "") + '"><div class="card-b" style="text-align:center">' +
        '<div style="font-size:24px;font-weight:600">' + y + '</div><div class="muted" style="font-size:12px">' + n1(computeMetric(appState, "ENV-GHG-TOT", { year: y, period: "FY", loc: "ALL", s2: RW.s2 }), "tCO2e") + "</div></div></div>").join("") + "</div>";
  } else if (RW.step === 2) {
    body = '<p class="muted" style="margin-top:0">Definí el perímetro de consolidación del reporte.</p>' +
      '<div class="field"><label>Grupo completo, entidad legal o ubicación</label><select class="sel" id="rw-scope" style="width:100%">' +
      '<option value="L:ALL"' + (RW.scope === 'ALL' ? ' selected' : '') + '>Todas las ubicaciones</option>' +
      '<optgroup label="Grupo">' + appState.masterData.locations.filter(l => !l.parent).map(l => '<option value="L:' + l.id + '"' + (RW.scope === l.id ? " selected" : "") + ">" + esc(l.name) + " (grupo completo)</option>").join("") + "</optgroup>" +
      '<optgroup label="Entidad legal">' + appState.masterData.legalEntities.map(e => '<option value="E:' + e.id + '"' + (RW.scope === e.id ? " selected" : "") + ">" + esc(e.name) + "</option>").join("") + "</optgroup>" +
      '<optgroup label="Ubicación">' + appState.masterData.locations.filter(l => l.parent || l.operable).map(l => '<option value="L:' + esc(l.id) + '"' + (RW.scopeKind === 'L' && RW.scope === l.id ? " selected" : "") + ">" + esc(l.name) + "</option>").join("") + "</optgroup>" +
      "</select></div>";
  } else if (RW.step === 3) {
    body = '<div class="grid g3">' + REPORT_TEMPLATES.filter(t => t.id === 'gen').map(t =>
      '<div class="card" data-rt="' + t.id + '" style="cursor:pointer;' + (RW.template === t.id ? "border-color:var(--accent);background:var(--accent-soft)" : "") + '">' +
      '<div class="card-b"><div class="k-ico" style="margin-bottom:9px"><i data-lucide="file-text"></i></div><b style="font-size:13px">' + t.name + '</b>' +
      '<p class="muted" style="margin:5px 0 0;font-size:12px">' + t.desc + "</p></div></div>").join("") + "</div>";
  } else {
    body = '<p class="muted" style="margin-top:0">Elegí las secciones a incluir en el borrador.</p>' +
      '<div class="grid g2" style="gap:2px">' + RW.sections.map((s, i) =>
        '<label class="chk"' + (s.sub ? ' style="padding-left:26px"' : "") + '><input type="checkbox" data-rs="' + i + '"' + (s.on ? " checked" : "") + "><span>" + esc(s.title) + "</span></label>").join("") + "</div>";
  }
  modal({
    title: "Generar reporte ESG", icon: "wand-2", size: "mid",
    badge: '<span class="badge">ESG General</span>',
    body: '<div class="steps">' + steps + "</div>" + body,
    footer: (RW.step > 1 ? '<button class="btn" id="rw-back">Atrás</button>' : '<button class="btn" data-close>Cancelar</button>') +
      '<button class="btn pri" id="rw-next">' + (RW.step === 4 ? '<i data-lucide="sparkles"></i> Generar borrador' : "Continuar") + "</button>",
    onMount: w => {
      $$("[data-ry]", w).forEach(c => c.onclick = () => { RW.year = +c.dataset.ry; drawReportWizard(); });
      $$("[data-rt]", w).forEach(c => c.onclick = () => { RW.template = c.dataset.rt; drawReportWizard(); });
      $$("[data-rs]", w).forEach(c => c.onchange = e => RW.sections[+e.target.dataset.rs].on = e.target.checked);
      const back = $("#rw-back", w); if (back) back.onclick = () => { RW.step--; drawReportWizard(); };
      $("#rw-next", w).onclick = () => {
        if (RW.step === 2) { const v = $("#rw-scope", w).value; RW.scopeKind = v[0]; RW.scope = v.slice(2); }
        if (RW.step < 4) { RW.step++; drawReportWizard(); return; }
        if (!RW.sections.some(s => s.on)) { toast('Elegí al menos una sección.', 'warn'); return; }
        runAiGeneration();
      };
    }
  });
}

/* ---------- IA SIMULADA (sin llamadas externas) ---------- */
function runAiGeneration() {
  const lines = ["Analizando métricas ESG…", "Comparando objetivos…", "Identificando tendencias…", "Preparando gráficos…", "Generando borrador…"];
  modal({
    title: "Generando reporte", icon: "sparkles", size: "",
    badge: '<span class="badge warn">Demo de IA</span>',
    body: '<div id="ai-lines" style="font-size:13.5px;line-height:2.1;min-height:150px"></div>' +
      '<div class="pbar" style="margin-top:8px"><i id="ai-bar" style="width:0%;transition:width .55s linear"></i></div>',
    onMount: w => {
      let i = 0;
      const tick = () => {
        if (i < lines.length) {
          $("#ai-lines", w).innerHTML += '<div class="flexrow"><i data-lucide="loader-2" style="width:14px;height:14px;color:var(--accent)"></i><span>' + lines[i] + "</span></div>";
          $("#ai-bar", w).style.width = ((i + 1) / lines.length * 100) + "%";
          icons(); i++; setTimeout(tick, 600);
        } else {
          appState.report = buildReport(RW);
          audit("Report generated", "Reporte ESG " + RW.year + " · plantilla " + RW.template + " · " + appState.report.sections.length + " secciones", "file-text");
          closeModal(); toast("Reporte generado. Revisá y editá el borrador antes de publicarlo.");
          ui.tab.reportes = "editor"; go("reportes");
        }
      };
      tick();
    }
  });
}

/* ---------- CONSTRUCCIÓN DEL CONTENIDO (templates JS sobre el dataset) ---------- */
function rctx(rw) { return { year: rw.year, period: "FY", loc: rw.scopeKind === "E" ? "GRP" : rw.scope, entity: rw.scopeKind === "E" ? rw.scope : "ALL", s2: filters.s2 }; }
function rv(rw, id) { return computeMetric(appState, id, rctx(rw)); }
function rYoY(rw, id) {
  const a = rv(rw, id), b = computeMetric(appState, id, Object.assign(rctx(rw), { year: rw.year - 1 }));
  return (a === null || b === null || !b) ? null : (a - b) / Math.abs(b) * 100;
}
function n1(v, u) { return fmtSmart(v, u) + " " + unitSmart(v, u); }
function dirWord(x) { return x === null ? "una variación no comparable" : x < 0 ? "una reducción del " + fmt(Math.abs(x), 1) + "%" : "un aumento del " + fmt(x, 1) + "%"; }

function buildReport(rw) {
  const on = id => rw.sections.find(s => s.id === id && s.on);
  const scopeName = rw.scopeKind === "E"
    ? (appState.masterData.legalEntities.find(e => e.id === rw.scope) || {}).name
    : locName(rw.scope);
  const tot = rv(rw, "ENV-GHG-TOT"), s1 = rv(rw, "ENV-GHG-S1"), s3 = rv(rw, "ENV-GHG-S3");
  const s2 = rv(rw, filters.s2 === "Market-based" ? "ENV-GHG-S2M" : "ENV-GHG-S2L");
  const sections = [];
  const P = (t) => ({ type: "p", text: t });
  const H = (t) => ({ type: "h3", text: t });
  const C = (id, cap, kind) => ({ type: "chart", id, cap, kind });

  if (on("exec")) sections.push({
    id: "exec", title: "1. Executive Summary", blocks: [
      P("Durante " + rw.year + ", las emisiones totales de GEI de " + scopeName + " alcanzaron " + n1(tot, "tCO2e") + ", representando " + dirWord(rYoY(rw, "ENV-GHG-TOT")) + " respecto del período anterior. El inventario se elabora conforme al GHG Protocol Corporate Standard y a la norma ISO 14064-1, con un enfoque de consolidación por control operativo."),
      P("El alcance 3 concentra " + fmt(s3 / (tot || 1) * 100, 1) + "% del inventario, lo que confirma que la mayor parte del impacto climático de la organización se origina en su cadena de valor. Las emisiones directas (alcance 1) totalizaron " + n1(s1, "tCO2e") + " y las asociadas a la energía adquirida (alcance 2, " + filters.s2.toLowerCase() + ") " + n1(s2, "tCO2e") + "."),
      P("En materia de energía, el consumo del período fue de " + n1(rv(rw, "ENV-ENERGY"), "kWh") + ", con una participación renovable de " + fmt(rv(rw, "ENV-ENERGY-REN"), 1) + "%. El consumo de agua alcanzó " + n1(rv(rw, "ENV-WATER-CONS"), "m³") + " y los residuos generados " + n1(rv(rw, "ENV-WASTE"), "t") + "."),
      P("En la dimensión social, la organización cerró el ejercicio con " + fmt(rv(rw, "SOC-EMP")) + " personas empleadas, " + fmt(rv(rw, "SOC-WOM-MGMT"), 1) + "% de mujeres en puestos de gestión y " + fmt(rv(rw, "SOC-INJ")) + " accidentes registrables. En gobernanza se registraron " + fmt(rv(rw, "GOV-CORR")) + " incidentes de corrupción confirmados, con " + fmt(rv(rw, "GOV-ANTICORR"), 0) + "% de la plantilla formada en políticas anticorrupción."),
      C("rep-exec", "Evolución de las emisiones totales de GEI por alcance, " + CONFIG.YEARS[0] + "–" + CONFIG.YEARS[CONFIG.YEARS.length - 1] + " (tCO2e)", "stack")
    ]
  });

  if (on("intro")) sections.push({
    id: "intro", title: "2. Introduction / Reporting Scope", blocks: [
      P("Este reporte cubre el ejercicio " + rw.year + " y comprende el perímetro de " + scopeName + ", integrado por " + fmt(scopeLocs(appState, rw.scopeKind === "E" ? "GRP" : rw.scope).length) + " ubicaciones operativas en " + Array.from(new Set(appState.masterData.locations.filter(l => l.operable).map(l => l.countryName))).join(", ") + ". La consolidación se realiza bajo el enfoque de control operativo y utiliza los potenciales de calentamiento global del IPCC AR6 a 100 años."),
      P("La información proviene de " + fmt(appState.measures.length + appState.actuals.length) + " registros gestionados en " + CONFIG.APP_NAME + ", alimentados por la integración nativa con " + CONFIG.CARBON_APP + ", extracciones del ERP corporativo y cargas asistidas de Excel y CSV. Cada indicador conserva la trazabilidad hasta el registro de origen."),
      P("El nivel de aseguramiento externo declarado para el período es " + ((appState.qualitative.find(q => q.metricId === "QL-ASSURE") || {}).value || "no definido").toLowerCase() + ". La calidad de datos consolidada de la plataforma al momento de la generación es de " + fmt(dataQuality().score, 0) + "%.")
    ]
  });

  if (on("env")) {
    const blocks = [P("El desempeño ambiental se estructura en carbono, energía, agua, residuos y uso del suelo. Los objetivos asociados se monitorean contra trayectorias definidas desde el año base " + CONFIG.BASE_YEAR + ".")];
    if (on("climate")) {
      blocks.push(H("3.1 Carbon footprint"),
        P("Las emisiones totales del período fueron " + n1(tot, "tCO2e") + ", distribuidas en " + fmt(s1 / (tot || 1) * 100, 1) + "% de alcance 1, " + fmt(s2 / (tot || 1) * 100, 1) + "% de alcance 2 y " + fmt(s3 / (tot || 1) * 100, 1) + "% de alcance 3. La intensidad de emisiones se ubicó en " + fmt(rv(rw, "ENV-GHG-INT"), 0) + " tCO2e por millón de dólares de ingresos, " + dirWord(rYoY(rw, "ENV-GHG-INT")) + " interanual."),
        P("Dentro del alcance 3, las categorías más relevantes son " + S3_CATS.map(c => ({ c, v: filterDataset(appState, Object.assign(rctx(rw), { measure: "CO2E", dims: { ghgScope: "Scope 3", scope3Cat: c.name } })).reduce((a, r) => a + r.value, 0) })).sort((a, b) => b.v - a.v).slice(0, 3).map(x => x.c.name.replace(/^Cat\. \d+ · /, "") + " (" + fmt(x.v / (s3 || 1) * 100, 1) + "%)").join(", ") + ". Las emisiones evitadas por proyectos de eficiencia y contratos renovables alcanzaron " + n1(rv(rw, "ENV-GHG-AVOID"), "tCO2e") + " y se reportan por separado, sin descontarse del inventario."),
        C("rep-scope", "Distribución del inventario por alcance, " + rw.year, "donut"));
    }
    if (on("energy")) blocks.push(H("3.2 Energy"),
      P("El consumo energético del período fue de " + n1(rv(rw, "ENV-ENERGY"), "kWh") + ", " + dirWord(rYoY(rw, "ENV-ENERGY")) + " respecto de " + (rw.year - 1) + ". La energía renovable representó " + fmt(rv(rw, "ENV-ENERGY-REN"), 1) + "% del total, a través de contratos PPA y generación solar on-site."),
      C("rep-energy", "Consumo energético por ubicación, " + rw.year, "bar-loc-energy"));
    if (on("water")) blocks.push(H("3.3 Water"),
      P("La extracción de agua totalizó " + n1(rv(rw, "ENV-WATER-WD"), "m³") + " y el consumo neto " + n1(rv(rw, "ENV-WATER-CONS"), "m³") + ", " + dirWord(rYoY(rw, "ENV-WATER-CONS")) + " interanual. El objetivo de reducción vigente se monitorea contra la trayectoria definida para " + ((getMetricTarget("ENV-WATER-CONS") || {}).targetYear || "2028") + "."));
    if (on("waste")) blocks.push(H("3.4 Waste"),
      P("Se generaron " + n1(rv(rw, "ENV-WASTE"), "t") + " de residuos, de los cuales " + n1(rv(rw, "ENV-WASTE-HAZ"), "t") + " corresponden a residuos peligrosos (" + fmt(rv(rw, "ENV-WASTE-HAZ") / (rv(rw, "ENV-WASTE") || 1) * 100, 1) + "% del total). La segregación en origen y la sustitución de solventes son las principales palancas del plan de reducción."));
    if (on("land")) blocks.push(H("3.5 Land / Biodiversity"),
      P("La superficie ocupada por las operaciones del perímetro asciende a " + fmt(rv(rw, "ENV-LAND"), 1) + " hectáreas. No se registran operaciones dentro de áreas protegidas ni de alto valor de biodiversidad declaradas."));
    sections.push({ id: "env", title: "3. Environmental Performance", blocks });
  }

  if (on("social")) {
    const blocks = [P("El desempeño social cubre salud y seguridad, diversidad e inclusión, y condiciones de empleo del conjunto de la plantilla del perímetro reportado.")];
    if (on("hs")) blocks.push(H("4.1 Health & Safety"),
      P("Se registraron " + fmt(rv(rw, "SOC-INJ")) + " accidentes con registro obligatorio y " + fmt(rv(rw, "SOC-FATAL")) + " fatalidades, con " + fmt(rv(rw, "SOC-LOST")) + " días perdidos acumulados. La variación interanual de accidentes fue de " + pct(rYoY(rw, "SOC-INJ")) + "."),
      C("rep-safety", "Accidentes registrables por ubicación, " + rw.year, "bar-loc-inj"));
    if (on("di")) blocks.push(H("4.2 Diversity & Inclusion"),
      P("Las mujeres representan " + fmt(rv(rw, "SOC-WOM-MGMT"), 1) + "% de los puestos de gestión y " + fmt(rv(rw, "SOC-WOM-GOV"), 1) + "% de los órganos de gobierno. La brecha salarial de género se ubica en " + fmt(rv(rw, "SOC-PAYGAP"), 1) + "%, " + dirWord(rYoY(rw, "SOC-PAYGAP")) + " respecto del período anterior."));
    if (on("emp")) blocks.push(H("4.3 Employees"),
      P("La dotación al cierre del ejercicio fue de " + fmt(rv(rw, "SOC-EMP")) + " personas, con una rotación de " + fmt(rv(rw, "SOC-TURN"), 1) + "% y un promedio de " + fmt(rv(rw, "SOC-TRAIN"), 1) + " horas de formación por empleado."));
    sections.push({ id: "social", title: "4. Social Performance", blocks });
  }

  if (on("gov")) sections.push({
    id: "gov", title: "5. Governance", blocks: [
      H("5.1 Governance structure"),
      P("La supervisión de la agenda ESG recae en " + ((appState.qualitative.find(q => q.metricId === "QL-BOARD") || {}).value || "la alta dirección") + ". La participación femenina en el órgano de gobierno alcanza " + fmt(rv(rw, "GOV-WOM-BODY"), 1) + "%."),
      P((appState.qualitative.find(q => q.metricId === "QL-RISK") || {}).value || ""),
      H("5.2 Ethics and anti-corruption"),
      P("Durante " + rw.year + " se confirmaron " + fmt(rv(rw, "GOV-CORR")) + " incidentes de corrupción. El " + fmt(rv(rw, "GOV-ANTICORR"), 0) + "% de la plantilla completó la formación anual en políticas anticorrupción. La cobertura del código de conducta de proveedores alcanza a " + ((appState.qualitative.find(q => q.metricId === "QL-SUPPLIER") || {}).value || "—").toLowerCase() + ".")
    ]
  });

  if (on("eco")) sections.push({
    id: "eco", title: "6. Economic Performance", blocks: [
      P("Los ingresos del período alcanzaron " + fmt(rv(rw, "ECO-REV"), 0) + " M USD, con costos operativos de " + fmt(rv(rw, "ECO-OPEX"), 0) + " M USD. La inversión neta fue de " + fmt(rv(rw, "ECO-INV"), 0) + " M USD y el gasto en investigación y desarrollo de " + fmt(rv(rw, "ECO-RND"), 0) + " M USD."),
      P("La relación entre desempeño económico y ambiental se expresa en la intensidad de emisiones, que alcanzó " + fmt(rv(rw, "ENV-GHG-INT"), 0) + " tCO2e por millón de dólares de ingresos, permitiendo evaluar el desacople entre crecimiento e impacto climático.")
    ]
  });

  if (on("targets")) sections.push({
    id: "targets", title: "7. ESG Targets and Ambitions", blocks: [
      P("La organización mantiene " + appState.targets.length + " objetivos ESG activos. Al cierre del período, " + appState.targets.filter(t => calculateTargetProgress(t).status === "On Track").length + " se encuentran dentro de la trayectoria prevista, " + appState.targets.filter(t => calculateTargetProgress(t).status === "At Risk").length + " en riesgo y " + appState.targets.filter(t => calculateTargetProgress(t).status === "Off Track").length + " fuera de trayectoria."),
      { type: "table", id: "tgt" },
      C("rep-targets", "Avance de objetivos por área ESG (%)", "bar-area")
    ]
  });

  if (on("impr")) {
    const worst = appState.targets.map(t => ({ t, p: calculateTargetProgress(t) })).sort((a, b) => (a.p.progress - a.p.expected) - (b.p.progress - b.p.expected)).slice(0, 3);
    sections.push({
      id: "impr", title: "8. Improvement Opportunities", blocks: [
        P("A partir del análisis de brechas entre desempeño real y trayectorias objetivo, se identifican las siguientes prioridades para el próximo ciclo:"),
        P("1. " + worst[0].t.name + ": el avance acumulado es de " + fmt(worst[0].p.progress, 0) + "% frente a un " + fmt(worst[0].p.expected, 0) + "% esperado. Requiere revisar las palancas asociadas y su calendario de inversión."),
        P("2. " + worst[1].t.name + ": brecha de " + fmt(Math.abs(worst[1].p.expected - worst[1].p.progress), 0) + " puntos porcentuales respecto de la trayectoria."),
        P("3. Ampliar la cobertura de datos primarios en las categorías de alcance 3 con mayor peso relativo, hoy estimadas parcialmente a partir de factores de gasto, para mejorar la precisión del inventario y la calidad de datos, actualmente en " + fmt(dataQuality().score, 0) + "%.")
      ]
    });
  }

  return {
    meta: {
      title: (rw.template === "climate" ? "IVZ Climate Report " : rw.template === "esrs" ? "IVZ Sustainability Statement (ESRS) " : "IVZ Sustainability Report ") + rw.year,
      year: rw.year, scope: rw.scope, scopeName, template: rw.template,
      generated: CONFIG.DEMO_DATE, status: "Draft"
    },
    sections, rw
  };
}

    '<div class="flexrow no-print" style="margin-bottom:14px"><button class="btn ghost" id="r-exit"><i data-lucide="arrow-left"></i></button>' +

    '<div class="rep-layout"><div class="rep-nav no-print card"><div class="card-b" style="padding:10px">' +

  $("#r-exit").onclick = () => { ui.tab.reportes = null; render(); };
  $("#r-print").onclick = () => window.print();
  $("#r-prev").onclick = () => { document.body.classList.toggle("preview"); toast("Vista previa: se ocultan los controles de edición."); };
  $("#r-dl").onclick = downloadReport;
  $("#r-regen").onclick = () => regenSection(R.sections[0].id);
  $$("[data-rsec]", el).forEach(b => b.onclick = () => {
    $$("[data-rsec]", el).forEach(x => x.classList.remove("on")); b.classList.add("on");
    const t = document.getElementById("sec-" + b.dataset.rsec); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  drawReportDoc();
}

function drawReportDoc() {
  const R = appState.report;
  const doc = $("#rep-doc");
  doc.innerHTML =
    '<div class="rep-cover"><div class="flexrow" style="margin-bottom:14px"><img class="rep-logo" src="' + CONFIG.LOGO + '" alt="Invenzis">' +
    '<span class="muted" style="font-size:12.5px">' + esc(CONFIG.APP_NAME) + " · " + esc(CONFIG.VENDOR) + "</span></div>" +
    "<h1>" + esc(R.meta.title) + "</h1>" +
    '<p class="muted" style="margin:0">' + esc(R.meta.scopeName) + " · ejercicio " + R.meta.year + " · borrador generado el " + esc(R.meta.generated) + "</p></div>" +
    '<div class="disclaim"><b>Aviso.</b> Este reporte fue generado mediante una funcionalidad demostrativa. Los resultados deben ser revisados y validados antes de su publicación.</div>' +
    '<div class="rep-fig" style="background:#fff"><b style="font-size:13px">Contenido</b><ol style="margin:8px 0 0;padding-left:20px;font-size:13px;line-height:1.9">' +
    R.sections.map(s => "<li>" + esc(s.title.replace(/^\d+\.\s*/, "")) + "</li>").join("") + "</ol></div>" +
    R.sections.map(s => '<section id="sec-' + s.id + '"><h2>' + esc(s.title) + "</h2>" +
      s.blocks.map((b, i) => {
        if (b.type === "h3") return "<h3>" + esc(b.text) + "</h3>";
        if (b.type === "chart") return '<div class="rep-fig"><div class="chart-box"><canvas id="' + b.id + '"></canvas></div><div class="cap">Figura · ' + esc(b.cap) + "</div></div>";
        if (b.type === "table") return '<div class="rep-fig" style="padding:0"><table class="tbl"><thead><tr><th>Objetivo</th><th>Base</th><th>Actual</th><th>Meta</th><th>Estado</th></tr></thead><tbody>' +
          appState.targets.map(t => { const p = calculateTargetProgress(t); return "<tr><td>" + esc(t.name) + '</td><td class="r">' + fmtSmart(p.base, t.unit) + '</td><td class="r">' + fmtSmart(p.cur, t.unit) + '</td><td class="r">' + fmtSmart(t.targetValue, t.unit) + '</td><td><span class="badge ' + (p.status === "On Track" ? "ok" : p.status === "At Risk" ? "warn" : "bad") + '">' + p.status + "</span></td></tr>"; }).join("") +
          "</tbody></table></div>";
        return '<p contenteditable="true" data-sec="' + s.id + '" data-blk="' + i + '">' + esc(b.text) + "</p>";
      }).join("") +
      '<div class="no-print" style="margin-top:6px"><button class="btn sm" data-regen="' + s.id + '"><i data-lucide="refresh-cw"></i> Regenerar sección</button></div>' +
      "</section>").join("");
  $$("[contenteditable]", doc).forEach(p => p.onblur = e => {
    const s = appState.report.sections.find(x => x.id === e.target.dataset.sec);
    s.blocks[+e.target.dataset.blk].text = e.target.textContent;
    audit("Report edited", "Sección " + s.title, "pencil");
  });
  $$("[data-regen]", doc).forEach(b => b.onclick = () => regenSection(b.dataset.regen));
  drawReportCharts();
  icons();
}

function drawReportCharts() {
  const R = appState.report, rw = R.rw;
  R.sections.forEach(s => s.blocks.filter(b => b.type === "chart").forEach(b => {
    if (b.kind === "stack") {
      mkChart(b.id, {
        type: "bar",
        data: { labels: CONFIG.YEARS, datasets: ["Scope 1", "Scope 2", "Scope 3"].map((sc, i) => ({ label: sc, data: CONFIG.YEARS.map(y => filterDataset(appState, Object.assign(rctx(rw), { year: y, measure: "CO2E", dims: { ghgScope: sc } })).reduce((a, r) => a + r.value, 0)), backgroundColor: [PAL.accent, PAL.teal, PAL.accent3][i], borderRadius: 3 })) },
        options: baseOpts({ plugins: { legend: { display: true, position: "bottom" } }, scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, beginAtZero: true, grid: { color: PAL.line }, ticks: { callback: v => (v / 1e6).toFixed(2) + "M" } } } })
      });
    } else if (b.kind === "donut") {
      const g = sc => filterDataset(appState, Object.assign(rctx(rw), { measure: "CO2E", dims: { ghgScope: sc } })).reduce((a, r) => a + r.value, 0);
      mkChart(b.id, donutCfg(["Scope 1", "Scope 2", "Scope 3"], [g("Scope 1"), g("Scope 2"), g("Scope 3")], [PAL.accent, PAL.teal, PAL.accent3]));
    } else if (b.kind === "bar-loc-energy") {
      const rows = appState.masterData.locations.filter(l => l.operable).map(l => ({ k: l.name, v: computeMetric(appState, "ENV-ENERGY", Object.assign(rctx(rw), { locs: [l.id] })) })).sort((a, b2) => b2.v - a.v);
      mkChart(b.id, barCfg(rows.map(x => x.k), [{ label: "kWh", data: rows.map(x => x.v), backgroundColor: PAL.teal }], {}, true));
    } else if (b.kind === "bar-loc-inj") {
      const rows = appState.masterData.locations.filter(l => l.operable).map(l => ({ k: l.name, v: computeMetric(appState, "SOC-INJ", Object.assign(rctx(rw), { locs: [l.id] })) })).sort((a, b2) => b2.v - a.v);
      mkChart(b.id, barCfg(rows.map(x => x.k), [{ label: "Casos", data: rows.map(x => x.v), backgroundColor: PAL.warn }], {}, true));
    } else if (b.kind === "bar-area") {
      const areas = ["Environmental", "Social", "Governance"];
      mkChart(b.id, barCfg(areas, [{ label: "Avance (%)", data: areas.map(a => { const ts = appState.targets.filter(t => t.area === a); return ts.length ? +(ts.reduce((s, t) => s + Math.max(0, calculateTargetProgress(t).progress), 0) / ts.length).toFixed(1) : 0; }) }]));
    }
  }));
}

const REGEN_VARIANTS = [
  t => t.replace("representando", "lo que implica").replace("alcanzaron", "totalizaron"),
  t => t.replace("Durante", "A lo largo de").replace("se ubicó en", "alcanzó un valor de"),
  t => t.replace("La información proviene de", "Los datos utilizados provienen de")
];
function regenSection(id) {
  toast("Esta funcionalidad requiere conexión con el servicio de IA.", "warn");
  setTimeout(() => {
    const s = appState.report.sections.find(x => x.id === id);
    s.blocks.filter(b => b.type === "p").forEach((b, i) => { b.text = REGEN_VARIANTS[i % REGEN_VARIANTS.length](b.text); });
    audit("Report section regenerated", s.title + " (demo)", "refresh-cw");
    destroyCharts(); drawReportDoc(); toast("Sección regenerada con una nueva versión del borrador.");
  }, 1200);
}

function downloadReport() {
  const doc = $("#rep-doc");
  if (typeof html2pdf === "undefined") { toast("html2pdf no disponible: usá Print para exportar a PDF.", "warn"); window.print(); return; }
  toast("Preparando PDF del borrador…");
  html2pdf().set({ margin: 12, filename: appState.report.meta.title.replace(/\s+/g, "_") + ".pdf", image: { type: "jpeg", quality: .96 }, html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: "mm", format: "a4", orientation: "portrait" } })
    .from(doc).save().then(() => { audit("Report downloaded", appState.report.meta.title, "download"); });
}

/* ============================================================
   23. DEMO GUIADA
   ============================================================ */
const TOUR = [
  { route: "inicio", title: "Inicio", text: "Visualiza el desempeño ESG consolidado: emisiones, energía, agua, seguridad y gobernanza en un único panel, con filtros globales por año, período, entidad y ubicación." },
  { route: "datos", title: "Importar datos", text: "Carga datos ESG mediante Excel o CSV. El asistente detecta el tipo de archivo por sus cabeceras, permite mapear columnas y valida cada fila antes de incorporarla al modelo.", action: () => { ui.tab.datos = "imports"; } },
  { route: "metricas", title: "Métricas", text: "Gestiona indicadores ambientales, sociales, económicos y de gobernanza, incluyendo métricas calculadas y datos cualitativos." },
  { route: "ambiciones", title: "Ambiciones", text: "Compara resultados reales contra objetivos, con trayectoria esperada y estado On Track, At Risk u Off Track." },
  { route: "emisiones", title: "Emisiones", text: "Analiza Scope 1, 2 y 3 hasta nivel de ubicación, actividad y categoría, con selección entre método location-based y market-based." },
  { route: "emisiones", title: "Trazabilidad", text: "Accede desde un KPI hasta los registros que lo originaron: indicador → métrica → medida → registro original, sin salir de la plataforma." },
  { route: "integraciones", title: "Integración " + CONFIG.CARBON_APP, text: "Automatiza la incorporación de información de carbono. " + CONFIG.CARBON_APP + " publica el inventario corporativo y las huellas de producto como medidas ESG trazables." },
  { route: "reportes", title: "Reportes", text: "Genera borradores de reportes ESG utilizando IA, con estructura profesional, gráficos del dashboard y edición sección por sección." }
];

function startTour() {
  ui.tour = 0; drawTour();
}
function drawTour() {
  const s = TOUR[ui.tour];
  if (s.action) s.action();
  if (ui.route !== s.route) go(s.route);
  const old = $("#tour-mask"); if (old) old.remove();
  const d = document.createElement("div");
  d.id = "tour-mask";
  d.innerHTML = '<div class="tour-card"><div class="t-h"><div class="flexrow"><span class="badge accent">Paso ' + (ui.tour + 1) + " de " + TOUR.length + '</span>' +
    '<button class="icon-btn right" id="t-exit"><i data-lucide="x"></i></button></div>' +
    '<h3 style="margin:10px 0 0;font-size:17px">' + esc(s.title) + "</h3></div>" +
    '<div class="t-b"><p style="margin:0;color:var(--ink-2);font-size:13.5px;line-height:1.65">' + esc(s.text) + "</p></div>" +
    '<div class="t-f"><div class="tour-dots">' + TOUR.map((x, i) => '<i class="' + (i === ui.tour ? "on" : "") + '"></i>').join("") + "</div>" +
    '<button class="btn" id="t-prev" ' + (ui.tour === 0 ? "disabled" : "") + ">Anterior</button>" +
    '<button class="btn pri" id="t-next">' + (ui.tour === TOUR.length - 1 ? "Finalizar" : "Siguiente") + "</button></div></div>";
  document.body.appendChild(d);
  $("#t-exit").onclick = endTour;
  $("#t-prev").onclick = () => { if (ui.tour > 0) { ui.tour--; drawTour(); } };
  $("#t-next").onclick = () => { if (ui.tour < TOUR.length - 1) { ui.tour++; drawTour(); } else endTour(true); };
  icons();
}
function endTour(done) {
  const d = $("#tour-mask"); if (d) d.remove();
  ui.tour = null;
  if (done) toast("Demo guiada completada. Explorá libremente el prototipo.");
}

    body: '<dl class="kv"><dt>Usuario</dt><dd>' + CONFIG.USER.name + "</dd><dt>Rol</dt><dd>" + CONFIG.USER.role + "</dd>" +
      "<dt>Producto</dt><dd>" + esc(CONFIG.APP_NAME) + " " + CONFIG.VERSION + "</dd><dt>Registros en sesión</dt><dd>" + fmt(appState.measures.length + appState.actuals.length) + "</dd>" +
      "<dt>Persistencia</dt><dd>Sólo en memoria — al actualizar la página se restaura el dataset demo</dd></dl>" +
      '<div class="hr"></div><div class="flexrow"><button class="btn" id="u-reset"><i data-lucide="rotate-ccw"></i> Restaurar datos demo</button>' +
      '<button class="btn" id="u-clear"><i data-lucide="eraser"></i> Vaciar dataset</button>' +
      '<button class="btn" id="u-tour"><i data-lucide="play-circle"></i> Demo guiada</button></div>',

    onMount: w => {
      $("#u-reset", w).onclick = () => confirmDialog("Restaurar datos demo", "Se descartan todos los cambios de la sesión y se vuelve al dataset inicial. ¿Continuar?", () => {
        appState = buildInitialState(); filters = { year: CONFIG.CURRENT_YEAR, period: "FY", loc: "GRP", entity: "ALL", area: "ALL", s2: "Market-based" };
        ui.dyn = {}; ui.tab = {}; destroyCharts(); toast("Dataset demo restaurado"); go("inicio");
      }, "Restaurar");
      $("#u-clear", w).onclick = () => confirmDialog("Vaciar dataset", "Se eliminan medidas, datos reales y objetivos para probar los estados vacíos de la aplicación. ¿Continuar?", () => {
        appState.measures = []; appState.actuals = []; appState.targets = []; appState.report = null;
        audit("Dataset cleared", "Se vació el dataset de la sesión", "eraser");
        destroyCharts(); toast("Dataset vaciado. Importá datos para volver a poblar la plataforma.", "warn"); go("inicio");
      }, "Vaciar");
      $("#u-tour", w).onclick = () => { closeModal(); startTour(); };
    }
  });
}

function init(initialState) {
  appState = initialState || buildInitialState();
  $("#favicon").href = CONFIG.LOGO;
  renderNav();
  renderShell();
  render();
  $("#btn-tour").onclick = startTour;
  $("#btn-user").onclick = openUserMenu;
  $("#btn-menu").onclick = () => $("#side").classList.toggle("open");
  const mq = window.matchMedia("(max-width:1024px)");
  const applyMq = () => { $("#btn-menu").style.display = mq.matches ? "inline-flex" : "none"; };
  mq.addEventListener ? mq.addEventListener("change", applyMq) : mq.addListener(applyMq);
  applyMq();
  icons();
  setTimeout(() => toast(appState.measures.length + appState.actuals.length ? "Datos guardados cargados: " + fmt(appState.measures.length + appState.actuals.length) + " registros." : "Sin datos cargados. Usá Importar datos para comenzar."), 500);
}
